name: keep demo warm

# Render's free plan sleeps after 15 minutes without traffic, and waking it
# takes ~40 s. A light ping keeps the public demo ready for judges.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 https://recallrelay.onrender.com/health
